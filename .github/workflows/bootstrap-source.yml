name: Expand reviewed public source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand:
    if: contains(github.event.head_commit.message, '[bootstrap-source]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct reviewed source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap-source/source.b64.* | base64 --decode > /tmp/android-link-source.tar.xz
          echo "2b2497c7848076f5c57073f6b4dff41e31f518258e123d7b83ca717490b328e6  /tmp/android-link-source.tar.xz" | sha256sum -c -
          rm -rf /tmp/android-link-source
          mkdir -p /tmp/android-link-source
          tar -xJf /tmp/android-link-source.tar.xz -C /tmp/android-link-source
          SRC="$(find /tmp/android-link-source -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$SRC"
          rsync -a --delete --exclude='.git/' "$SRC/" ./
          # The Actions token cannot create/update workflow files. Keep this
          # bootstrap workflow for this commit and add release.yml separately.
          rm -f .github/workflows/release.yml
          git checkout HEAD -- .github/workflows/bootstrap-source.yml
      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish reviewed Android Link v0.5.6 source"
          git push
